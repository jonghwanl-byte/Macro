name: Macro Early Warning

on:
  schedule:
    # UTC 23:00 = 한국시간(KST) 다음날 08:00
    # 일~목 UTC 실행 → 한국 기준 월~금 아침 8시
    - cron: '15 20 * * 0-5'
  workflow_dispatch:        # 액션 탭에서 수동 실행 버튼

jobs:
  send-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 매크로 알림 전송
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TZ: Asia/Seoul
        run: python macro_alert.py
