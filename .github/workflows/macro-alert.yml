name: Macro Early Warning

on:
  schedule:
    # 20:40 UTC = 다음날 05:40 KST
    # GitHub 예약 실행은 30분 지연될 수 있어 30분 앞당겨 둡니다.
    # UTC 일~금(0-5) = KST 월~토 → 일요일 수신 제외
    - cron: "40 20 * * 0-5"
  workflow_dispatch:        # Actions 탭에서 수동 실행 버튼

jobs:
  send-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 매크로 알림 전송
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TZ: Asia/Seoul
        run: python macro_alert.py
